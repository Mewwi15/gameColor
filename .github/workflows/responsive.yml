name: Responsive checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAMECOLOR_BUNDLED_BROWSER: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e -- --project=responsive --max-failures=5
      - name: Save device screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: responsive-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
